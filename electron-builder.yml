appId: co.eris.creidhne
productName: Creidhne
directories:
  buildResources: build
# Turn off escape hatches built into the Electron binary that Creidhne never uses.
# The one that matters is runAsNode: without it,
#   ELECTRON_RUN_AS_NODE=1 Creidhne.exe -e "<script>"
# turns the shipped, signed binary into a general-purpose Node interpreter — a real
# capability handed to anything that can set an environment variable. It also makes
# the app immune to the trap where that variable, exported in a shell, makes a
# healthy launch look like a crash.
#
# onlyLoadAppFromAsar can break a packaged launch, so start the built app once
# after adding this. Creidhne has no native addon; app code loads from app.asar
# and the asarUnpack'd resources (lua-annotations, lua-stubs, xsd) are data, not
# app code, so the fuse does not touch them.
#
# Native electron-builder config, NOT an afterPack hook: on the mac universal build
# the per-arch packs must stay pristine and the fuses have to be flipped once on the
# merged app right before signing. A per-arch hook corrupts the universal merge with
# an "identical SHAs" failure. resetAdHocDarwinSignature is there because flipping
# fuses rewrites the Electron Framework binary and invalidates the ad-hoc signature
# that is mandatory on Apple Silicon.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
# Allowlist, not a denylist. electron-builder packages the whole project dir
# minus `files` excludes; a denylist silently leaks every new top-level tree
# (coverage/, e2e/, docs/, .claude/, playwright.config.mjs, CLAUDE.md all used
# to ship). An allowlist ships only these four — the build output, the runtime
# node_modules (externalizeDepsPlugin keeps main/preload deps here), resources/
# (main reads splash.html + icons + lua-annotations from it), and the manifest.
# CHANGELOG.md is intentionally absent: What's New bundles it at build time via
# a Vite `?raw` import, so the file itself does not ship.
files:
  - 'out/**'
  - 'resources/**'
  - 'node_modules/**'
  - 'package.json'
asarUnpack:
  # These are read from disk at runtime by src/main/index.js:
  #   - resources/lua-annotations/.luarc.json is fs.copyFile'd into the user's library
  #   - lua-stubs/*.lua are fs.readdir'd + fs.copyFile'd (lua:setupEnvironment)
  #   - xsd/src/XSD/*.xsd are fs.readdir'd + fs.readFile'd (constants:loadXsdTypes)
  # Unpack so readdir/copyFile operate on real files, not asar-virtual entries.
  # The other resources/ entries are icons that don't need unpacking, so keep
  # this narrow instead of unpacking all of resources/**.
  - resources/lua-annotations/**
  - lua-stubs/**
  - xsd/**
win:
  executableName: Creidhne
  icon: resources/icon.png
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # Frozen frame of resources/splash.html shown while the exe extracts to %TEMP%
  # (before electron exists). Regenerate with scripts/make-portable-splash.mjs.
  splashImage: build/portable-splash.bmp
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - deb
    - AppImage
  category: Development
  maintainer: Hybrasyl Maintainers <hybrasyl@eris.co>
  icon: resources/icon.png
npmRebuild: false
