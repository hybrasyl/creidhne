appId: co.eris.creidhne
productName: Creidhne
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!scripts/**'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!eslint.config.{js,ts,mjs,cjs}'
asarUnpack:
  # These are read from disk at runtime by src/main/index.js:
  #   - resources/lua-annotations/.luarc.json is fs.copyFile'd into the user's library
  #   - lua-stubs/*.lua are fs.readdir'd + fs.copyFile'd (lua:setupEnvironment)
  #   - xsd/src/XSD/*.xsd are fs.readdir'd + fs.readFile'd (constants:loadXsdTypes)
  # Unpack so readdir/copyFile operate on real files, not asar-virtual entries.
  # The other resources/ entries are icons that don't need unpacking, so keep
  # this narrow instead of unpacking all of resources/**.
  - resources/lua-annotations/**
  - lua-stubs/**
  - xsd/**
win:
  executableName: Creidhne
  icon: resources/icon.png
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - deb
    - AppImage
  category: Development
  maintainer: Hybrasyl Maintainers <hybrasyl@eris.co>
  icon: resources/icon.png
npmRebuild: false
