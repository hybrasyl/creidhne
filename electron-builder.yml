appId: co.eris.creidhne
productName: Creidhne
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!xsd/**'
  - '!scripts/**'
  - '!lua-stubs/**'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!eslint.config.{js,ts,mjs,cjs}'
asarUnpack:
  # Only the lua-annotations template needs to be a real on-disk file
  # (src/main/index.js fs.copyFile's it into the user's library). The other
  # resources/ entries are icons that don't need unpacking, so scope this
  # narrowly instead of unpacking all of resources/**.
  - resources/lua-annotations/**
win:
  executableName: Creidhne
  icon: resources/icon.png
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - deb
    - AppImage
  category: Development
  maintainer: Hybrasyl Maintainers <hybrasyl@eris.co>
  icon: resources/icon.png
npmRebuild: false
