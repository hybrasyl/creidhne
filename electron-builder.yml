appId: co.eris.creidhne
productName: Creidhne
directories:
  buildResources: build
# Turn off escape hatches built into the Electron binary that Creidhne never uses.
# The one that matters is runAsNode: without it,
#   ELECTRON_RUN_AS_NODE=1 creidhne.exe -e "<script>"
# turns the shipped, signed binary into a general-purpose Node interpreter — a real
# capability handed to anything that can set an environment variable. It also makes
# the app immune to the trap where that variable, exported in a shell, makes a
# healthy launch look like a crash.
#
# onlyLoadAppFromAsar can break a packaged launch, so start the built app once
# after adding this. Creidhne has no native addon; app code loads from app.asar
# and the asarUnpack'd resources (lua-annotations, lua-stubs, xsd) are data, not
# app code, so the fuse does not touch them.
#
# Native electron-builder config, NOT an afterPack hook: on the mac universal build
# the per-arch packs must stay pristine and the fuses have to be flipped once on the
# merged app right before signing. A per-arch hook corrupts the universal merge with
# an "identical SHAs" failure. resetAdHocDarwinSignature is there because flipping
# fuses rewrites the Electron Framework binary and invalidates the ad-hoc signature
# that is mandatory on Apple Silicon.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
# Allowlist, not a denylist. electron-builder packages the whole project dir
# minus `files` excludes; a denylist silently leaks every new top-level tree
# (coverage/, e2e/, docs/, .claude/, playwright.config.mjs, CLAUDE.md all used
# to ship). An allowlist ships only these four — the build output, the runtime
# node_modules (externalizeDepsPlugin keeps main/preload deps here), resources/
# (main reads splash.html + icons + lua-annotations from it), and the manifest.
# CHANGELOG.md is intentionally absent: What's New bundles it at build time via
# a Vite `?raw` import, so the file itself does not ship.
files:
  - 'out/**'
  - 'resources/**'
  - 'node_modules/**'
  - 'package.json'
asarUnpack:
  # These are read from disk at runtime by src/main/index.js:
  #   - resources/lua-annotations/.luarc.json is fs.copyFile'd into the user's library
  #   - lua-stubs/*.lua are fs.readdir'd + fs.copyFile'd (lua:setupEnvironment)
  #   - xsd/src/XSD/*.xsd are fs.readdir'd + fs.readFile'd (constants:loadXsdTypes)
  # Unpack so readdir/copyFile operate on real files, not asar-virtual entries.
  # The other resources/ entries are icons that don't need unpacking, so keep
  # this narrow instead of unpacking all of resources/**.
  - resources/lua-annotations/**
  - lua-stubs/**
  - xsd/**
win:
  # Lowercase, matching taliesin and epona. productName stays capitalised -- that
  # is what the window and the installed app are called. This is the filename, and
  # it is also what desktopName falls back to on Linux and what a companion app's
  # colocated-sibling probe looks for (creidhne.exe beside taliesin.exe).
  executableName: creidhne
  icon: resources/icon.png
  # Both, matching taliesin and epona (HTOO-373). Creidhne shipped portable-only,
  # which left Windows as the one platform with no installed form -- no Start
  # Menu entry, no uninstaller, and nothing for the update notice to lead to
  # except a manual re-download. It also made HTOO-351's fault 2 unanswerable,
  # since that card was written against an installer this app did not have.
  #
  # The list lives HERE and not in the workflow's packaging step. Taliesin shipped
  # for months with `--win portable` in the workflow against a config declaring
  # both, publishing four assets where five were configured, and every gate passed
  # -- the config is the half a reader checks. scripts/release-artifacts.test.mjs
  # enforces the absence of a target list there.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  # Predictable name for the release workflow's sign + upload steps. The default
  # is "Creidhne Setup <version>.exe", with spaces, which every path in that
  # workflow would then have to quote.
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Assisted rather than one-click, and per-user rather than per-machine. The
  # three settle together and match taliesin and epona:
  #   * oneClick: false gives a wizard rather than an install that starts on
  #     double-click. This tool sits beside a world repository and a Dark Ages
  #     install, so where it goes is a decision the user may want to make.
  #   * perMachine: false installs under the user profile, so there is no UAC
  #     prompt and no administrator requirement. It also agrees with where the
  #     app already keeps its data: %LOCALAPPDATA%\Erisco\Creidhne.
  #   * allowToChangeInstallationDirectory only has an effect when oneClick is
  #     false; NSIS has no directory page to offer in a one-click install.
  # Changing perMachine after a release is the expensive one: an existing
  # per-user installation is not upgraded by a per-machine installer, and the
  # user ends with two.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # Frozen frame of resources/splash.html shown while the exe extracts to %TEMP%
  # (before electron exists). Regenerate with scripts/make-portable-splash.mjs.
  splashImage: build/portable-splash.bmp
  # Extract to a directory unique to each LAUNCH, not to each BUILD.
  #
  # Left unset, electron-builder bakes one KSUID into the exe at build time, so
  # every copy of a given build extracts to the same $TEMP\<ksuid>. Launch a
  # second copy and portable.nsi does `RMDir /r $INSTDIR` on the directory the
  # RUNNING app is executing from, then CopyFiles into it -- which fails on the
  # locked exe and DLLs. extractAppPackage.nsh retries 5 times a second apart and
  # then shows NSIS's own MB_RETRYCANCEL "Creidhne cannot be closed" box. One more
  # Retry and it overwrites a live app non-atomically with errors ignored.
  #
  # None of that is reachable from our side: portable.nsi never inserts
  # CHECK_APP_RUNNING (only installSection.nsh and uninstaller.nsh do), and
  # PortableOptions has no `include`/`script` field, so there is no hook for a
  # customCheckAppRunning macro and no way to change those buttons. Removing the
  # collision is the fix -- the second launch then reaches Electron, loses
  # requestSingleInstanceLock, and app.exit(0)s while the first window comes
  # forward. That is the whole intended behaviour, with no dialog in it.
  #
  # TRUE, not the documented `false`. app-builder-lib 26.15.3 resolves this as
  #   if (typeof unpackDirName === "string" || !unpackDirName)
  #     defines.UNPACK_DIR_NAME = unpackDirName || generateKsuid()
  # so `false` takes the branch (`!false`) and still gets a build-time KSUID --
  # the documented value does not produce the documented behaviour. Only a truthy
  # non-string skips the branch, leaving UNPACK_DIR_NAME undefined so portable.nsi
  # falls back to $PLUGINSDIR\app, which NSIS makes unique per process. Do not
  # "correct" this to `false`; that silently restores the collision.
  #
  # Measured, not read: three portable exes built off this one config key. The
  # marker build proves the technique -- an explicitly named unpack dir is NOT
  # findable as a string in the exe (the NSIS header is LZMA-compressed), so
  # "the name is absent" could never have been the evidence. Artifact sizes are:
  #   true                      90,713,628   <- smallest; the !ifdef block is elided
  #   CREIDHNEPROBEMARKERXYZ    90,713,662   22-char name
  #   false                     90,713,671   27-char name
  # generateKsuid() returns exactly 27 chars, and false lands 9 bytes above the
  # 22-char marker -- so `false` demonstrably received a KSUID rather than the
  # per-launch $PLUGINSDIR the docs promise. Owed: launch two copies and confirm
  # two distinct directories under %TEMP%. That needs a GUI and is not done here.
  #
  # Cost is one extraction per launch, which we were paying anyway -- portable.nsi
  # RMDir /r's and re-extracts on every launch regardless of the directory name.
  unpackDirName: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - deb
    - AppImage
  category: Development
  maintainer: Hybrasyl Maintainers <hybrasyl@eris.co>
  # A DIRECTORY, not a file (HTOO-38). electron-builder never resamples a single PNG:
  # it collects every `NxN.png` in the directory it is pointed at and installs each
  # into the matching hicolor path. `resources/icon.png` alone therefore shipped one
  # size, and it was a hand-made 256 with 2 alpha levels and a one-pixel-off bounding
  # box. `scripts/make-icons.mjs` writes all eight from the 1024 star master.
  #
  # Only files matching /^(\d+)(?:x\d+)?\.png$/i are collected
  # (app-builder-lib `iconConverter.js`, `collectIconsFromDir`), so a stray
  # `1024x1024.png` left in there by an experiment is silently shipped.
  # `scripts/icons.test.mjs` asserts the directory holds exactly the eight and nothing
  # else -- do not add a file here without adding it there.
  icon: build/icons
  # The window-manager association (HTOO-63). Without it a `.desktop` entry and the
  # running window can disagree, and the taskbar and switcher fall back to a generic
  # icon however good the hicolor set is -- so 38 without 63 produces an app that
  # passes the payload check and looks wrong in use.
  #
  # Set explicitly as a PAIR rather than relying on the default: electron-builder 27
  # flips this on, and stating both makes that a no-op instead of a silent rename.
  #
  # The other half is `desktopName` and it lives in **package.json**, not here --
  # `LinuxTargetHelper` reads `packager.info.metadata.desktopName`, and Electron
  # derives `app_id` / `WM_CLASS` from the same field, which is the whole reason the
  # two must agree. Without it electron-builder falls back to `executableName` for the
  # filename and to `productName` for `StartupWMClass`, which is `creidhne` against
  # `Creidhne` -- and a mismatch there is exactly the generic-icon symptom.
  syncDesktopName: true
npmRebuild: false
