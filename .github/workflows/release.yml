name: Release

# Requires these repository secrets before the first tagged release:
#   ES_USERNAME / ES_PASSWORD / ES_CREDENTIAL_ID / ES_TOTP_SECRET  (SSL.com eSigner, Windows;
#                                                                  CodeSignTool on Temurin 17)
#   MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD                    (Developer ID cert)
#   APPLE_API_KEY_P8_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER  (App Store Connect, notarize)
#   DISCORD_WEBHOOK_URL                                            (release announcement)

# TAGS AND MANUAL ONLY (HTOO-390). This used to fire on `pull_request` AND on
# every push to `main`, and the second was the expensive one by a wide margin:
# the build jobs are guarded only by `github.event_name != 'pull_request'`, so a
# push to main ran build-windows, build-linux AND build-mac in full -- and then
# skipped `release`, because that one checks `ref_type == 'tag'`. Every merge
# built three platforms' artifacts and threw them away.
#
# GitHub bills macOS runners at 10x and windows at 2x. One day of house-wide CI
# on 2026-08-12 exhausted the shared Actions allowance and hit the account's
# spending limit mid-merge; this workflow was the largest single contributor.
#
# What replaces the lost per-PR check is a LOCAL gate, run by hand before a
# push: `npm run validate`, plus `npm run validate:linux` for real Linux
# through WSL.
#
# Everything below still runs on a `v*` tag and on workflow_dispatch, including
# validate, so a release is still gated and the macOS and Linux artifacts are
# still built -- neither can be built on the dev box at all.
#
# Fire it by hand when a change is platform-shaped:
#   gh workflow run release.yml --ref <branch>

# TAG DIRECTLY (Sabrael, 2026-10-12). Do not rehearse a release with
# workflow_dispatch before you push the tag. The `release` job runs only after
# every build job passes, so a tag run that fails publishes nothing, and the
# fix is a re-tag. A rehearsal builds every platform twice to save that. Remote
# e2e and testing are fine (ci.yml, where the repo has one); building the
# release twice is not.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# No FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 env. It was here for one holdout,
# sslcom/esigner-codesign (`using: node20`). That action is gone (HTOO-517):
# build-windows runs CodeSignTool itself. Every action left runs on node24.

jobs:
  # Fast validation gate — runs on every PR to main (and before any release
  # build). Keeps lint / tests green so they can't silently rot (these are not
  # otherwise enforced anywhere). No typecheck step: Creidhne is JavaScript.
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # xsd/ is gitignored and fetched from the public hybrasyl/xml releases;
      # the XSD-validation tests read it.
      - name: Fetch XSD schemas
        run: npm run fetch-xsd

      - name: Lint
        run: npm run lint:check

      - name: Test + coverage gate
        run: npm run test:coverage

  # End-to-end gate. The Playwright/Electron specs drive the BUILT app, so they
  # need a full build and a real display. GitHub's Windows runners have a desktop
  # session, so these run without xvfb. Own job to keep the lint/test signal fast.
  e2e:
    runs-on: windows-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # xsd/ is gitignored and fetched from the public hybrasyl/xml releases;
      # the built app reads it at runtime.
      - name: Fetch XSD schemas
        run: npm run fetch-xsd

      # `npm run e2e` builds first; the specs load out/main/index.js.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    needs: [validate, e2e]
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # xsd/ is gitignored and fetched from the public hybrasyl/xml releases.
      # electron-builder unpacks xsd/** and the app reads it at runtime, so the
      # packaged build needs it present.
      - name: Fetch XSD schemas
        run: npm run fetch-xsd

      - name: Build app
        run: npm run build

      # No target list here, so the Windows targets live in electron-builder.yml
      # and nowhere else. Taliesin named one of its two targets in this step and
      # quietly built one of them for months, shipping four assets where five
      # were configured -- with every gate green, because a list of globs cannot
      # report the entry missing from the list.
      #
      # scripts/release-artifacts.test.mjs enforces the absence of a target list
      # here, and pins the config's targets against the release job's globs in
      # both directions.
      - name: Package installer + portable exe
        run: npx electron-builder --win --publish never

      # HTOO-374. The fuses are burned into the packed binary and nothing before
      # this point can see them: lint, the test suite, `npm run build` and the
      # whole e2e run all pass on a build that has silently stopped applying
      # them, because none of them touches a packaged artifact. This is the first
      # moment one exists, so it is the first moment the check is possible.
      #
      # Reads dist/win-unpacked/, which electron-builder leaves beside the
      # portable exe — the fuse wire lives in the unpacked binary, not in the
      # self-extracting wrapper.
      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs dist/win-unpacked/creidhne.exe

      # Resolve both artifact PATHs by globbing what electron-builder actually
      # wrote, rather than restating its artifactName templates here. Spelling a
      # name out is how this step breaks on a rename, and it breaks only on a tag
      # push -- there is no earlier gate that runs it. Fail loudly if either glob
      # does not land on exactly one file, because a silent miss would hand the
      # signer a nonexistent path.
      - name: Resolve Windows artifacts
        id: artifact
        shell: bash
        run: |
          shopt -s nullglob
          for kind in portable setup; do
            files=(dist/*-"$kind".exe)
            if [ ${#files[@]} -ne 1 ]; then
              echo "expected exactly one dist/*-$kind.exe, found ${#files[@]}: ${files[*]}" >&2
              exit 1
            fi
            echo "$kind=${files[0]}" >> "$GITHUB_OUTPUT"
          done

      # WINDOWS SIGNING: CodeSignTool on a CURRENT JDK, never its bundled one
      # (HTOO-517, the mabon shape).
      #
      # Every CodeSignTool release (v1.3.2 is the newest) bundles JDK 11.0.2 from
      # 2019, and its CodeSignTool.bat always runs that JDK. On 2026-09-30 SSL.com
      # renewed the certificate of login.ssl.com, the OAuth host CodeSignTool
      # signs in at. The new chain ends at "SSL.com TLS RSA Root CA 2022" with no
      # cross-signed copy, and the old trust store does not have that root: every
      # sign fails with `PKIX path building failed`. sslcom/esigner-codesign,
      # which this job used before, runs the bundled JDK. Temurin 17 has the root.
      #
      # No `if:` guard on the secrets, unlike mabon. Creidhne has always signed
      # unconditionally, so a run without the ES_* secrets fails. It does not
      # publish unsigned files.
      - name: Set up Java 17 for CodeSignTool
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ONE step signs BOTH artifacts, so they are signed together or not at all.
      # Signing one and not the other is worse than signing neither: a user
      # handed a signed installer beside an unsigned portable exe cannot read
      # that as "credentials are configured for one artifact". Any failure stops
      # the job before the upload. release-artifacts.test.mjs requires that this
      # step names each Windows target, so a third .exe that this step does not
      # sign fails on a commit, not on a tag.
      #
      # CodeSignTool is pinned (as in epona, mabon and oghma): the eSigner
      # protocol has changed between releases. It reads conf/ from its working
      # directory, so it runs in its own folder. -output_dir_path stops it from
      # asking whether to replace the input. That prompt would wait until the job
      # times out.
      #
      # CodeSignTool can print an error and still exit 0, and write no file. Thus
      # the step reads each signature back and requires the status `Valid`.
      - name: Sign installer + portable exe (SSL.com eSigner)
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CODESIGNTOOL_VERSION: '1.3.2'
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "${{ github.workspace }}/${{ steps.artifact.outputs.setup }}",
            "${{ github.workspace }}/${{ steps.artifact.outputs.portable }}"
          )
          $archive = "CodeSignTool-v$env:CODESIGNTOOL_VERSION-windows.zip"
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v$env:CODESIGNTOOL_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/$archive" -UseBasicParsing
          Expand-Archive -Path "$env:RUNNER_TEMP/$archive" -DestinationPath "$env:RUNNER_TEMP/codesigntool" -Force
          $jar = Get-ChildItem "$env:RUNNER_TEMP/codesigntool" -Recurse -Filter 'code_sign_tool-*.jar' | Select-Object -First 1
          if (-not $jar) { throw "no code_sign_tool jar in $archive" }
          $toolDir = $jar.Directory.Parent.FullName
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          & $java -version
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "not found: $file" }
            $out = Join-Path $env:RUNNER_TEMP 'esigner-output'
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Push-Location $toolDir
            try {
              & $java -jar $jar.FullName sign "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" "-credential_id=$env:ES_CREDENTIAL_ID" "-totp_secret=$env:ES_TOTP_SECRET" "-input_file_path=$file" "-output_dir_path=$out" "-override=true"
              if ($LASTEXITCODE -ne 0) { throw "CodeSignTool exited $LASTEXITCODE for $file" }
            } finally {
              Pop-Location
            }
            $signed = Join-Path $out (Split-Path $file -Leaf)
            if (-not (Test-Path $signed)) { throw "CodeSignTool wrote no signed file for $file" }
            Move-Item -Force $signed $file
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "signature on $file is $($sig.Status)" }
            Write-Host "signed: $file ($($sig.SignerCertificate.Subject))"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          # Both, and `if-no-files-found: error` covers both -- the setup exe is
          # named by `nsis.artifactName` in electron-builder.yml, so a rename
          # there fails this step rather than silently shipping one artifact.
          # The `.blockmap` electron-builder writes beside the installer is not
          # collected: it exists for electron-updater's differential download,
          # and this app has no updater (updateCheck.js notifies and downloads
          # nothing).
          path: |
            dist/*-portable.exe
            dist/*-setup.exe
          if-no-files-found: error
          # The release job downloads these minutes later; keep them out of the
          # 90-day default that otherwise exhausts the Actions storage quota.
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # xsd/ is gitignored and fetched from the public hybrasyl/xml releases.
      # electron-builder unpacks xsd/** and the app reads it at runtime, so the
      # packaged build needs it present.
      - name: Fetch XSD schemas
        run: npm run fetch-xsd

      - name: Build app
        run: npm run build

      - name: Package Linux deb + AppImage
        run: npx electron-builder --linux --publish never

      # HTOO-374, per platform. Each job packs its own artifact and no other job
      # can see it, so the check has to run in each — one platform verifying its
      # own fuses says nothing about the others'.
      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs dist/linux-unpacked/creidhne

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          # The release job downloads these minutes later; keep them out of the
          # 90-day default that otherwise exhausts the Actions storage quota.
          retention-days: 1

  build-mac:
    runs-on: macos-latest
    needs: [validate, e2e]
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # xsd/ is gitignored and fetched from the public hybrasyl/xml releases.
      # electron-builder unpacks xsd/** and the app reads it at runtime, so the
      # packaged build needs it present.
      - name: Fetch XSD schemas
        run: npm run fetch-xsd

      - name: Build app
        run: npm run build

      # Set up our own signing keychain (rather than electron-builder's
      # CSC_LINK throwaway) so the post-build dmg codesign can reach the
      # same Developer ID identity. electron-builder auto-discovers it.
      - name: Import Developer ID signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          # Make our keychain searchable/default for the toolchain.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key
        id: asc
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # electron-builder signs + notarizes + staples the .app (auto-discovers
      # the identity from our keychain), then wraps it in the dmg.
      - name: Package, sign + notarize app
        run: npx electron-builder --mac --publish never
        env:
          APPLE_API_KEY: ${{ steps.asc.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # HTOO-374, and this is the platform the check was written for: the dmg is
      # built `arch: universal`, so the .app carries one fuse wire per slice.
      # `flipFuses` writes both and @electron/fuses' own reader returns only the
      # first, which is why scripts/verify-fuses.mjs scans every sentinel — a
      # merge that flipped one slice and not the other passes any check that
      # stops at the first.
      #
      # After packaging and before the dmg is signed: re-signing a binary whose
      # fuses are wrong just produces a signed wrong binary.
      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs "dist/mac-universal/Creidhne.app"

      # The dmg itself is unsigned/un-notarized out of electron-builder, so a
      # downloaded dmg would trip Gatekeeper. Sign, notarize + staple it too.
      - name: Sign, notarize + staple the dmg
        env:
          APPLE_API_KEY: ${{ steps.asc.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Glob what electron-builder wrote instead of rebuilding its
          # artifactName here; a hardcoded name breaks on a rename and only a tag
          # push would ever find out.
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected exactly one dist/*.dmg, found ${#dmgs[@]}: ${dmgs[*]}" >&2
            exit 1
          fi
          DMG="${dmgs[0]}"
          codesign --force --timestamp \
            --sign "Developer ID Application: ERISCO LLC (D4Q96JRVKU)" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          # The release job downloads these minutes later; keep them out of the
          # 90-day default that otherwise exhausts the Actions storage quota.
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-mac]
    if: github.ref_type == 'tag'

    steps:
      # Checkout (the release job otherwise only downloads artifacts) so the
      # CHANGELOG + extract script are on disk.
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Pull this tag's section from CHANGELOG.md into the release body. Missing
      # section → empty file → the release falls back to the auto notes below.
      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-extract.mjs "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*-portable.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
          # Curated CHANGELOG section on top; generate_release_notes appends the
          # auto PR list + Full Changelog link below it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Notify Discord
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"**Creidhne $TAG** is now available!\n$RELEASE_URL\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      # The house version manifest (versions.json in hybrasyl/cernunnos, update-check
      # module v1) is NOT written here. That write is a commit and push by the
      # developer who releases, with their own git access: the workflow has no
      # credential for cernunnos, by decision. Running apps learn of this release only
      # after that step, so this step prints the command on the run page (a notice)
      # and in the job summary.
      - name: Remind to publish the version manifest
        if: success()
        run: |
          CMD="npm run publish:version -- ${{ github.ref_name }}"
          echo "::notice title=Publish the version manifest::Start the packaged app, then run: $CMD"
          {
            echo "### Next: publish the version manifest"
            echo
            echo "Start the packaged app from the release. Then run this in the app checkout:"
            echo
            echo "    $CMD"
            echo
            echo "Running copies of the app do not see this release until you do."
          } >> "$GITHUB_STEP_SUMMARY"
